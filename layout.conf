# Sysex Bandit -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py).
# Browser renderer (vst.json "art": "html"): real Titillium Web, knob and keycap sheen.
# Canvas is 1280x628 below the 86 px tab strip -- layout y 86..714.
#
# The page itself (logo, labels, box outlines, stepper fields) is hand-drawn artwork
# shipped in artwork/ and dropped over the generated skin by skin_post.py, so NOTHING
# here may draw a box or a label over it: every readout is box=0, which bakes no box
# and no label, leaving only the live value text inside the drawn frame. The stepper
# has no box=0, so theme_lcd/theme_line below are tuned to the artwork's field.
#
# MPC's Label does not wrap, so TX and RX are one readout per line: TX_LINES/RX_LINES
# of them, each with its own param (tx2.. / rx2..), sized so one line of hex just
# fills the width of its box. BPL and the line count live in src/sysex_bandit.c and
# must move together with these boxes.
#
# Dark mode: #000000 plate, light gray #d2d2d2 text on it, violet text in the boxes.
# Two violets, strictly split: 9a66d4 is text, 5a2494 is fills (the keycaps and the
# knobs' pointer and arc; the knob value text stays 9a66d4 because 5a2494 on black
# is 2.1:1 and unreadable).
label_scale=1.35
scale_names=1
art_css=skin.css
button_img=btn.svg
theme_bg=000000
theme_panel=101010
theme_ink=d2d2d2
theme_ink_dim=b4b4b4
theme_ink_faint=6a6a6a
theme_accent=9a66d4
theme_accent_hi=9a66d4
theme_line=6e6e6e
theme_box=1c1c1c
theme_lcd=000000
theme_knob_face=8f8f8f
theme_knob_ring=3a3a3a
theme_knob_dot=5a2494
theme_seg_active=5a2494
theme_seg_active_tx=f4eff9
theme_seg_inactive=1c1c1c
theme_btn_bg=5a2494
theme_btn_text=f4eff9
theme_btn_text_plain=f4eff9
theme_display_ink=9a66d4

[tab SEND]
art file=bg.svg
text cx=459 cy=338 size=2 label="SOURCE"
knob cx=84 cy=282 r=52 bw=140 key=message label="MESSAGE" ink_dim=9a66d4
button cx=220 cy=394 w=104 h=64 label="PREV" key=msg_prev
button cx=338 cy=394 w=104 h=64 label="NEXT" key=msg_next
enum_v cx=459 cy=394 sw=110 sh=32 key=send_src options="FILE,BYTES"
button cx=584 cy=394 w=112 h=64 label="SEND" key=send
button cx=719 cy=394 w=130 h=64 label="RESCAN" key=rescan
stepper cx=1023 cy=394 w=450 h=64 key=send_to label="OUT PORT"
readout cx=414 cy=490 w=800 h=26 box=0 label="TX" key=tx tsize=22 tcolor=9a66d4
readout cx=414 cy=518 w=800 h=26 box=0 label="TX 2" key=tx2 tsize=22 tcolor=9a66d4
readout cx=414 cy=546 w=800 h=26 box=0 label="TX 3" key=tx3 tsize=22 tcolor=9a66d4
readout cx=414 cy=574 w=800 h=26 box=0 label="TX 4" key=tx4 tsize=22 tcolor=9a66d4
readout cx=414 cy=602 w=800 h=26 box=0 label="TX 5" key=tx5 tsize=22 tcolor=9a66d4
readout cx=414 cy=630 w=800 h=26 box=0 label="TX 6" key=tx6 tsize=22 tcolor=9a66d4
readout cx=1038 cy=560 w=420 h=170 box=0 label="STATUS" key=status tsize=28 tcolor=9a66d4
qlinks "SEND" = message,send_src,send_to,rescan

